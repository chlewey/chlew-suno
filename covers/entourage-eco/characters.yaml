# Thomas' Entourage -- character sheet
#
# Appearance reference for the album covers (and anything else that draws the cast).
# Keys are the song-tag slugs, so covers, songs and tags line up.
#
# Extracted from entourage-characters_files/sheet001.html (Stable Diffusion prompts),
# plus prompts supplied later for Liis, Kadri, Zahra and Greca. Generator-specific
# syntax (1girl, masterpiece, weights like (x:1.4), framing, camera/lighting terms)
# is dropped; only the person is described. The scene each original prompt used is
# kept as `typical_setting` -- a default, not part of the character.
#
# `age` is the age in the source prompt, which is the age at the character's main
# story moment, NOT a common reference year (Sylvia is 21, Liis 22, Greca mid-40s).
# Adjust per cover to the album's in-universe date.
#
# `outfit.signature` is the source prompt's clothing (portrait + full-body combined).
#
# `scenes` holds alternative, album-specific moments: only what changes (age, outfit,
# hair, setting, props) is listed; everything else comes from the main entry.

